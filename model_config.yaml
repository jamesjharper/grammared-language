gector_deberta_large:
  type: gector
  backend: triton

  serving_config:
    triton_host: triton-server
    triton_port: 8001
    triton_protocol: grpc
    pretrained_model_name_or_path: "gotutiyan/gector-deberta-large-5k"
    device: cuda
    max_batch_size: 8
    preferred_batch_sizes: [1, 2, 4, 8]
    max_queue_delay_microseconds: 350

  model_inference_config:
    batch_size: 8

  grammared_config:
    # GEC rewrites are stable only after the sentence is complete.
    context_for_sure_match: complete_sentences_only


coedit_large:
  type: coedit
  backend: triton

  # Batch size used internally by the Hugging Face/ONNX text-generation
  # pipeline when processing multiple inputs. This is distinct from Triton's
  # request scheduler configuration below.
  model_init_config:
    batch_size: 8

  serving_config:
    # Triton gRPC endpoint.
    triton_host: triton-server
    triton_port: 8001
    triton_protocol: grpc

    # Source Hugging Face model repository or local model path.
    pretrained_model_name_or_path: "rayliuca/coedit-large-onnx"
    
    backend: ort
    device: cuda
    max_batch_size: 8
    preferred_batch_sizes: [1, 2, 4, 8]

    max_queue_delay_microseconds: 750

  model_inference_config:
    do_sample: false
    temperature: null
    num_beams: 1
    max_length: 128

  grammared_config:
    context_for_sure_match: complete_sentences_only
    prompt_template: "Make the sentence grammatical; keep capitalization : {{text}}"
