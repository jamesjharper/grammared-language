gector_deberta_large:
    type: gector
    backend: triton
    serving_config:
        triton_host: triton-server
        triton_port: 8001
        pretrained_model_name_or_path: "gotutiyan/gector-deberta-large-5k"
        triton_model_name: gector_deberta_large
        device: cuda # cpu, cuda, or auto


coedit_large:
    type: coedit
    backend: triton
    serving_config:
        triton_host: triton-server
        triton_port: 8001
        pretrained_model_name_or_path: "rayliuca/coedit-large-onnx"
        # pretrained_model_name_or_path: "rayliuca/coedit-large-onnx-quantized" # cpu only!
        triton_model_name: coedit_large
        backend: ort
        device: cuda # cpu, cuda, or auto
    model_init_config:
        batch_size: 8
    model_inference_config:
       # - do_sample: false (default): deterministic decoding, typically greedy/beam search. temperature has no effect.
       # - do_sample: true: introduces controlled variation. Lower temperature (e.g. 0.3) is more conservative; higher (e.g. 0.8–1.0) is more varied.
        temperature: 0.8
        do_sample: true

    grammared_config:
        prompt_template: "Fix grammatical errors: {{ text }}"

grammared_classifier:
    type: grammared_classifier
    backend: triton
    serving_config:
        pretrained_model_name_or_path: "rayliuca/grammared-classifier-deberta-v3-small"
        triton_model_name: grammared_classifier
        triton_host: triton-server
        triton_port: 8001
        backend: transformers
        device: auto # cpu, cuda, or auto

    model_init_config:
    model_inference_config:
    grammared_config:
